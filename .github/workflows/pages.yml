name: Deploy HTML reports to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static report bundle
        run: |
          mkdir _site
          find . -maxdepth 1 -type f -name '*.html' -exec cp '{}' _site/ \;
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/poiz_east_resale_comparison.html
          test -f _site/poiz_east_unit_growth_transactions.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
