name: Deploy HTML reports to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "site/**"
      - "scripts/build_pages_site.py"
      - "data/raw/edgeprop/edgeprop_condo_apartment_projects.csv"
      - "data/raw/edgeprop/edgeprop_condo_apartment_transactions_playwright_not_clean.csv"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --no-deps --editable .

      - name: Run required checks
        run: |
          python -m pytest -q
          python scripts/build_pages_site.py

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static report bundle
        run: python3 scripts/build_pages_site.py --out _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
