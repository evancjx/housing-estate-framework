name: Validate models, data contracts, and reports

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --no-deps --editable .

      - name: Run model and reproducibility tests
        run: python -m pytest -q

      - name: Validate static report catalog
        run: python scripts/build_pages_site.py
